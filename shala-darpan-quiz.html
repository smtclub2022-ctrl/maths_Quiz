<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="राजस्थान स्कूल शिक्षा परिषद (शाला दर्पण) कक्षा 10 गणित प्रश्न बैंक: 14 अध्याय व 2 मॉडल पेपर्स के 162 वस्तुनिष्ठ प्रश्न, ऑनलाइन क्विज़ एवं विस्तृत हल।">
  <title>शाला दर्पण प्रश्न-बैंक क्विज़ | कक्षा 10 गणित | I_Mentor_99</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #19223a;
      --muted: #64748b;
      --line: #e2e8f0;
      --paper: #ffffff;
      --canvas: #f8fafc;
      --indigo: #4f46e5;
      --indigo-dark: #3730a3;
      --indigo-pale: #eef2ff;
      --green: #10b981;
      --green-dark: #059669;
      --green-pale: #ecfdf5;
      --red: #ef4444;
      --red-pale: #fef2f2;
      --amber: #f59e0b;
      --amber-pale: #fffbeb;
      --whatsapp: #25d366;
      --whatsapp-dark: #1da851;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #f0f4ff 0%, var(--canvas) 25%, #ffffff 100%);
      color: var(--ink);
      font-family: "Noto Sans Devanagari", "DM Sans", -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    button, input, select { font: inherit; }
    
    /* TOPBAR */
    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(20px, calc((100vw - 1160px) / 2));
      background: rgba(255,255,255,0.95);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      color: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 800;
    }
    .logo-mark {
      flex: 0 0 68px;
      width: 68px;
      height: 46px;
      display: block;
    }
    .logo-mark img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .home-label {
      padding: 5px 10px;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      background: var(--indigo-pale);
      color: var(--indigo);
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #f1f5f9;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--line);
      transition: all .15s ease;
    }
    .chip:hover { background: #e2e8f0; color: var(--ink); }
    .chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .class-chip { background: var(--indigo-pale); color: var(--indigo); border-color: #c7d2fe; font-weight: 700; }
    
    .btn-whatsapp-pill {
      background: var(--whatsapp);
      color: white;
      border: 1px solid var(--whatsapp-dark);
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(37,211,102,0.3);
      transition: background .15s ease;
    }
    .btn-whatsapp-pill:hover { background: var(--whatsapp-dark); }

    /* MAIN CONTAINER */
    .main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 60px;
      flex: 1;
    }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #3730a3 0%, #4f46e5 55%, #6366f1 100%);
      color: white;
      border-radius: 24px;
      padding: 32px 36px;
      margin-bottom: 24px;
      box-shadow: 0 20px 40px rgba(79,70,229,0.22);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      top: -50px;
      right: -50px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      pointer-events: none;
    }
    .hero-eyebrow {
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #c7d2fe;
      font-weight: 700;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hero h1 { margin: 0 0 10px; font-size: clamp(22px, 3.6vw, 34px); line-height: 1.28; }
    .hero p { margin: 0 0 16px; font-size: 14.5px; color: #e0e7ff; line-height: 1.6; max-width: 650px; }
    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .hero-tag {
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 190px;
    }
    .btn-hero {
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      border: none;
      text-align: center;
      transition: all .15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-hero-primary {
      background: white;
      color: var(--indigo-dark);
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    }
    .btn-hero-primary:hover { background: #f8fafc; transform: translateY(-2px); }
    .btn-hero-secondary {
      background: rgba(255,255,255,0.16);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .btn-hero-secondary:hover { background: rgba(255,255,255,0.25); }

    /* FILTERS */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 22px;
      padding: 4px;
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid var(--line);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .filter-btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s ease;
    }
    .filter-btn:hover { color: var(--indigo); background: var(--indigo-pale); }
    .filter-btn.active { background: var(--indigo); color: white; }

    /* CHAPTER GRID */
    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 18px;
    }
    .chapter-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 16px rgba(15,23,42,0.04);
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }
    .chapter-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(79,70,229,0.12);
      border-color: #c7d2fe;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .badge-ch {
      background: var(--indigo-pale);
      color: var(--indigo);
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid #c7d2fe;
      letter-spacing: .02em;
    }
    .badge-mp {
      background: #fef3c7;
      color: #b45309;
      border-color: #fde68a;
    }
    .card-qcount {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      background: #f1f5f9;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .card-title {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--ink);
    }
    .card-summary {
      font-size: 12.5px;
      color: var(--muted);
      margin: 0 0 18px;
      line-height: 1.5;
    }
    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: auto;
    }
    .btn-quiz {
      background: var(--indigo);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background .15s ease;
    }
    .btn-quiz:hover { background: var(--indigo-dark); }
    .btn-study {
      background: #f8fafc;
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 10px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all .15s ease;
    }
    .btn-study:hover { background: var(--indigo-pale); border-color: #c7d2fe; color: var(--indigo); }

    /* QUIZ VIEW */
    .view-card {
      background: var(--paper);
      border-radius: 22px;
      border: 1px solid var(--line);
      padding: 28px;
      box-shadow: 0 10px 30px rgba(15,23,42,0.06);
    }
    .view-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    .breadcrumbs {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .breadcrumbs button {
      background: none;
      border: none;
      color: var(--indigo);
      padding: 0;
      font-weight: 700;
      cursor: pointer;
    }
    .timer-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      border-radius: 999px;
      background: var(--indigo-pale);
      color: var(--indigo-dark);
      font-weight: 700;
      font-size: 14.5px;
      border: 1px solid #c7d2fe;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: #edf2f7;
      overflow: hidden;
      margin-bottom: 22px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--indigo), #818cf8);
      transition: width .25s ease;
    }
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .q-number-pill {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--indigo);
      background: var(--indigo-pale);
      padding: 4px 12px;
      border-radius: 8px;
    }
    .q-source-pill {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 600;
    }
    .q-text {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.55;
      margin: 0 0 24px;
      color: var(--ink);
    }
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .option-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      background: #f8fafc;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s ease;
      color: var(--ink);
    }
    .option-btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .option-btn.selected {
      background: var(--indigo-pale);
      border-color: var(--indigo);
      color: var(--indigo-dark);
      font-weight: 700;
    }
    .option-key {
      flex: 0 0 32px;
      height: 32px;
      border-radius: 8px;
      background: #e2e8f0;
      color: #334155;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
    }
    .option-btn.selected .option-key {
      background: var(--indigo);
      color: white;
    }
    
    .hint-drawer {
      margin-bottom: 24px;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 12px 16px;
      background: #fafafa;
    }
    .hint-drawer summary {
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      user-select: none;
    }
    .hint-drawer p {
      margin: 10px 0 0;
      font-size: 13.5px;
      color: #334155;
      line-height: 1.5;
    }

    .q-nav-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 24px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .q-nav-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: white;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all .15s ease;
    }
    .q-nav-btn:hover { border-color: var(--indigo); color: var(--indigo); }
    .q-nav-btn.answered { background: #dcfce7; color: #15803d; border-color: #86efac; }
    .q-nav-btn.current { background: var(--indigo); color: white; border-color: var(--indigo); box-shadow: 0 0 0 2px rgba(79,70,229,0.3); }

    .nav-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .nav-actions-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .btn-secondary {
      background: #f1f5f9;
      border: 1px solid var(--line);
      color: #334155;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all .15s ease;
    }
    .btn-secondary:hover:not(:disabled) { background: #e2e8f0; }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: var(--indigo);
      border: 1px solid var(--indigo);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s ease;
    }
    .btn-primary:hover { background: var(--indigo-dark); }

    /* SCORECARD / RESULT */
    .result-score-card {
      text-align: center;
      padding: 34px 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, #3730a3 0%, #4f46e5 100%);
      color: white;
      margin-bottom: 26px;
      box-shadow: 0 14px 30px rgba(79,70,229,0.22);
    }
    .result-score-card h2 { margin: 6px 0 14px; font-size: 28px; }
    .result-score-card p { margin: 0; color: #c7d2fe; font-size: 14px; }
    .result-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .res-metric {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      padding: 12px 8px;
      border-radius: 12px;
    }
    .res-metric strong { display: block; font-size: 24px; font-weight: 800; }
    .res-metric span { font-size: 11px; text-transform: uppercase; color: #e0e7ff; letter-spacing: .04em; }

    .result-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }

    /* ANSWER REVIEW LIST */
    .review-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .review-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 20px;
    }
    .review-card.correct { border-left: 4px solid var(--green); }
    .review-card.incorrect { border-left: 4px solid var(--red); }
    .review-card.skipped { border-left: 4px solid var(--amber); }
    .review-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .review-badge {
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .review-badge.correct { background: var(--green-pale); color: var(--green-dark); }
    .review-badge.incorrect { background: var(--red-pale); color: var(--red); }
    .review-badge.skipped { background: var(--amber-pale); color: #b45309; }
    .review-prompt {
      font-size: 15.5px;
      font-weight: 600;
      margin: 0 0 14px;
      color: var(--ink);
      line-height: 1.5;
    }
    .review-options {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }
    .review-opt {
      padding: 8px 12px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid var(--line);
      font-size: 13.5px;
    }
    .review-opt.is-ans {
      background: var(--green-pale);
      border-color: #86efac;
      color: var(--green-dark);
      font-weight: 700;
    }
    .review-opt.user-wrong {
      background: var(--red-pale);
      border-color: #fca5a5;
      color: var(--red);
      font-weight: 700;
    }
    .review-solution {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #334155;
      line-height: 1.6;
    }
    .review-solution strong { color: var(--indigo-dark); }

    /* STUDY VIEW ACCORDIONS */
    .study-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .study-qnum {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      color: var(--indigo);
      background: var(--indigo-pale);
      padding: 3px 10px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    /* SHARE MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-content {
      background: white;
      border-radius: 20px;
      width: min(520px, 100%);
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: #e2e8f0; color: var(--ink); }
    .share-url-box {
      display: flex;
      gap: 8px;
      margin: 16px 0;
    }
    .share-url-input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font-size: 13px;
      background: #f8fafc;
    }
    .btn-copy {
      background: var(--indigo);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    /* TOAST */

    <div style="margin-top: 4px;">14 अध्यायवार क्विज़ + 2 बोर्ड मॉडल पेपर्स के 162 प्रामाणिक प्रश्न, संकेत व संपूर्ण समाधान</div>

  <!-- MODAL CONTAINER -->
  <div id="modalContainer"></div>

  <!-- LOAD QUESTION BANK -->
  <script src="shala-darpan-question-bank.js"></script>

  <script>
    // State management
    const state = {
      view: 'home', // 'home' | 'quiz' | 'result' | 'study'
      filter: 'all', // 'all' | 'part1' | 'part2' | 'models'
      chapterIndex: 0,
      isMegaMock: false,
      questions: [],
      currentIndex: 0,
      answers: [],
      elapsed: 0,
      timer: null
    };

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function getBank() {
      return window.shalaDarpanQuestionBank || [];
    }

    function showToast(message) {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<span>✓</span> <span>${escapeHtml(message)}</span>`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2600);
    }

    // HOME VIEW
    function renderHome() {
      state.view = 'home';
      clearInterval(state.timer);
      const bank = getBank();
      const totalQuestions = bank.reduce((sum, ch) => sum + (ch.questions ? ch.questions.length : 0), 0);

      // Filtering
      let filtered = bank;
      if (state.filter === 'part1') {
        filtered = bank.filter(c => c.chapter >= 1 && c.chapter <= 7);
      } else if (state.filter === 'part2') {
        filtered = bank.filter(c => c.chapter >= 8 && c.chapter <= 14);
      } else if (state.filter === 'models') {
        filtered = bank.filter(c => c.chapter >= 15);
      }

      const app = document.getElementById('app');
      app.innerHTML = `
        <section class="hero">
          <div class="hero-copy">
            <p class="hero-eyebrow">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM3.45 9L12 4.34 20.55 9 12 13.66 3.45 9zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
              राजस्थान स्कूल शिक्षा परिषद (शाला दर्पण)
            </p>
            <h1>कक्षा 10 गणित: अध्यायवार प्रश्न बैंक</h1>
            <p>राजस्थान राज्य शैक्षिक अनुसंधान एवं प्रशिक्षण परिषद (RSCERT) व स्कूल शिक्षा विभाग द्वारा तैयार किए गए प्रामाणिक वस्तुनिष्ठ प्रश्न। संपूर्ण 14 अध्याय एवं 2 बोर्ड मॉडल पेपर्स हल करें।</p>
            <div class="hero-tags">
              <span class="hero-tag">🎯 16 खंड</span>
              <span class="hero-tag">📝 ${totalQuestions} बहुविकल्पीय प्रश्न</span>
              <span class="hero-tag">💡 संकेत व चरणबद्ध हल</span>
              <span class="hero-tag">⚡ बोर्ड परीक्षा 2024–2026</span>
            </div>
          </div>
          <div class="hero-actions">
            <button type="button" class="btn-hero btn-hero-primary" id="megaMockBtn">
              <span>⚡ महा-मॉक टेस्ट (30 Qs)</span>
            </button>
            <button type="button" class="btn-hero btn-hero-secondary" id="shareHeroBtn">
              <span>📲 मित्रों को शेयर करें</span>
            </button>
          </div>
        </section>

        <!-- FILTERS -->
        <div class="filter-bar">
          <button type="button" class="filter-btn ${state.filter === 'all' ? 'active' : ''}\" data-filter="all">सभी खंड (16)</button>
          <button type="button" class="filter-btn ${state.filter === 'part1' ? 'active' : ''}\" data-filter="part1">अध्याय 1–7 (अंकगणित व बीजगणित)</button>
          <button type="button" class="filter-btn ${state.filter === 'part2' ? 'active' : ''}\" data-filter="part2">अध्याय 8–14 (त्रिकोणमिति, सांख्यिकी)</button>
          <button type="button" class="filter-btn ${state.filter === 'models' ? 'active' : ''}\" data-filter="models">बोर्ड मॉडल पेपर्स (2)</button>
        </div>

        <!-- CHAPTER GRID -->
        <div class="chapter-grid">
          ${filtered.map((item, idx) => {
            const originalIndex = bank.indexOf(item);
            const isModel = item.chapter >= 15;
            const badgeText = isModel ? `मॉडल पेपर ${item.chapter - 14}` : `अध्याय ${String(item.chapter).padStart(2, '0')}`;
            const qCount = item.questions ? item.questions.length : 0;
            return `
              <article class="chapter-card">
                <div>
                  <div class="card-head">
                    <span class="badge-ch ${isModel ? 'badge-mp' : ''}">${badgeText}</span>
                    <span class="card-qcount">${qCount} प्रश्न</span>
                  </div>
                  <h2 class="card-title">${escapeHtml(item.chapterTitle)}</h2>
                  <p class="card-summary">शाला दर्पण आधिकारिक प्रश्न-बैंक से चयनित वस्तुनिष्ठ प्रश्न, चार विकल्प और प्रामाणिक हल।</p>
                </div>
                <div class="card-actions">
                  <button type="button" class="btn-quiz" data-quiz="${originalIndex}">
                    <span>🎯 क्विज़ दें</span>
                  </button>
                  <button type="button" class="btn-study" data-study="${originalIndex}">
                    <span>📖 हल देखें</span>
                  </button>
                </div>
              </article>
            `;
          }).join('')}
        </div>
      `;

      // Event bindings
      document.querySelectorAll('[data-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.filter = btn.dataset.filter;
          renderHome();
        });
      });

      document.querySelectorAll('[data-quiz]').forEach(btn => {
        btn.addEventListener('click', () => {
          const index = parseInt(btn.dataset.quiz, 10);
          startQuiz(index);
        });
      });

      document.querySelectorAll('[data-study]').forEach(btn => {
        btn.addEventListener('click', () => {
          const index = parseInt(btn.dataset.study, 10);
          renderStudy(index);
        });
      });

      document.getElementById('megaMockBtn').addEventListener('click', () => {
        startMegaMock();
      });

      document.getElementById('shareHeroBtn').addEventListener('click', () => {
        openShareModal();
      });
    }

    // START QUIZ FOR CHAPTER
    function startQuiz(chapterIdx) {
      const bank = getBank();
      const chapter = bank[chapterIdx];
      if (!chapter || !chapter.questions || chapter.questions.length === 0) return;

      state.view = 'quiz';
      state.isMegaMock = false;
      state.chapterIndex = chapterIdx;
      state.questions = [...chapter.questions];
      state.currentIndex = 0;
      state.answers = new Array(state.questions.length).fill(null);
      state.elapsed = 0;
      
      clearInterval(state.timer);
      state.timer = setInterval(() => {
        state.elapsed += 1;
        const el = document.getElementById('quizTimer');
        if (el) el.textContent = '⏱ ' + formatTime(state.elapsed);
      }, 1000);

      renderQuizView();
    }

    // START MEGA MOCK (30 Random Questions across all chapters)
    function startMegaMock() {
      const bank = getBank();
      const allQ = [];
      bank.forEach((c) => {
        (c.questions || []).forEach(q => {
          allQ.push({ ...q, chapterTitle: c.chapterTitle, chapterNum: c.chapter });
        });
      });

      if (allQ.length === 0) return;

      // Shuffle and pick 30
      const shuffled = [...allQ].sort(() => Math.random() - 0.5);
      const selected = shuffled.slice(0, Math.min(30, shuffled.length));

      state.view = 'quiz';
      state.isMegaMock = true;
      state.chapterIndex = -1;
      state.questions = selected;
      state.currentIndex = 0;
      state.answers = new Array(state.questions.length).fill(null);
      state.elapsed = 0;

      clearInterval(state.timer);
      state.timer = setInterval(() => {
        state.elapsed += 1;
        const el = document.getElementById('quizTimer');
        if (el) el.textContent = '⏱ ' + formatTime(state.elapsed);
      }, 1000);

      renderQuizView();
    }

    // RENDER QUIZ QUESTION
    function renderQuizView() {
      const bank = getBank();
      const q = state.questions[state.currentIndex];
      const answeredCount = state.answers.filter(a => a !== null).length;
      const progressPercent = ((state.currentIndex + 1) / state.questions.length) * 100;
      const currentAnswer = state.answers[state.currentIndex];

      const chapterTitle = state.isMegaMock
        ? 'महा-मॉक टेस्ट (30 प्रश्न)'
        : (bank[state.chapterIndex] ? bank[state.chapterIndex].chapterTitle : 'शाला दर्पण क्विज़');

      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="view-card">
          <!-- TOP ROW -->
          <div class="view-top">
            <div class="breadcrumbs">
              <button type="button" id="quizBreadHome">⌂ मुख्य सूची</button>
              <span>›</span>
              <strong>${escapeHtml(chapterTitle)}</strong>
            </div>
            <div class="timer-badge" id="quizTimer">
              ⏱ ${formatTime(state.elapsed)}
            </div>
          </div>

          <!-- PROGRESS BAR -->
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${progressPercent}%"></div>
          </div>

          <!-- QUESTION NAV STRIP -->
          <div class="q-nav-strip">
            ${state.questions.map((_, i) => {
              const isCurr = i === state.currentIndex ? 'current' : '';
              const isAns = state.answers[i] !== null ? 'answered' : '';
              return `<button type="button" class="q-nav-btn ${isCurr} ${isAns}" data-goto="${i}">${i + 1}</button>`;
            }).join('')}
          </div>

          <!-- QUESTION CONTENT -->
          <div class="q-meta">
            <span class="q-number-pill">प्रश्न ${state.currentIndex + 1} / ${state.questions.length}</span>
            <span class="q-source-pill">${q.chapterTitle ? escapeHtml(q.chapterTitle) : 'शाला दर्पण प्रश्न-बैंक'}</span>
          </div>

          <h2 class="q-text">${escapeHtml(q.prompt)}</h2>

          <!-- OPTIONS -->
          <div class="options-grid">
            ${q.options.map((opt, i) => {
              const keyChar = ['(अ)', '(ब)', '(स)', '(द)'][i] || String.fromCharCode(65 + i);
              const isSelected = currentAnswer === opt;
              return `
                <button type="button" class="option-btn ${isSelected ? 'selected' : ''}" data-choice="${escapeHtml(opt)}">
                  <span class="option-key">${keyChar}</span>
                  <span>${escapeHtml(opt)}</span>
                </button>
              `;
            }).join('')}
          </div>

          <!-- HINT ACCORDION -->
          ${q.hint ? `
            <details class="hint-drawer">
              <summary>💡 संकेत देखें (Hint)</summary>
              <p>${escapeHtml(q.hint)}</p>
            </details>
          ` : ''}

          <!-- BOTTOM NAV BUTTONS -->
          <div class="nav-actions">
            <div>
              <button type="button" class="btn-secondary" id="prevBtn" ${state.currentIndex === 0 ? 'disabled' : ''}>← पिछला</button>
            </div>
            <div class="nav-actions-right">
              <span style="font-size:12px; color:var(--muted); font-weight:600;">${answeredCount}/${state.questions.length} हल</span>
              <button type="button" class="btn-secondary" id="skipBtn">छोड़ें</button>
              <button type="button" class="btn-primary" id="nextBtn">
                ${state.currentIndex === state.questions.length - 1 ? 'परिणाम देखें ✓' : 'अगला प्रश्न →'}
              </button>
            </div>
          </div>
        </div>
      `;

      // Event Handlers
      document.getElementById('quizBreadHome').addEventListener('click', renderHome);

      document.querySelectorAll('[data-goto]').forEach(b => {
        b.addEventListener('click', () => {
          state.currentIndex = parseInt(b.dataset.goto, 10);
          renderQuizView();
        });
      });

      document.querySelectorAll('[data-choice]').forEach(b => {
        b.addEventListener('click', () => {
          const val = b.dataset.choice;
          state.answers[state.currentIndex] = val;
          renderQuizView();
        });
      });

      document.getElementById('prevBtn').addEventListener('click', () => {
        if (state.currentIndex > 0) {
          state.currentIndex -= 1;
          renderQuizView();
        }
      });

      document.getElementById('skipBtn').addEventListener('click', () => {
        state.answers[state.currentIndex] = null;
        if (state.currentIndex === state.questions.length - 1) {
          submitQuiz();
        } else {
          state.currentIndex += 1;
          renderQuizView();
        }
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        if (state.currentIndex === state.questions.length - 1) {
          submitQuiz();
        } else {
          state.currentIndex += 1;
          renderQuizView();
        }
      });
    }

    // SUBMIT & SHOW SCORECARD
    function submitQuiz() {
      clearInterval(state.timer);
      state.view = 'result';

      let correctCount = 0;
      state.questions.forEach((q, i) => {
        if (state.answers[i] === q.answer) correctCount += 1;
      });

      const total = state.questions.length;
      const answered = state.answers.filter(a => a !== null).length;
      const skipped = total - answered;
      const wrong = answered - correctCount;
      const percent = Math.round((correctCount / total) * 100);

      const bank = getBank();
      const chapterTitle = state.isMegaMock
        ? 'महा-मॉक टेस्ट'
        : (bank[state.chapterIndex] ? bank[state.chapterIndex].chapterTitle : 'शाला दर्पण क्विज़');

      let rankMsg = 'उत्कृष्ट प्रदर्शन! आपकी तैयारी बहुत मजबूत है। 🎉';
      if (percent < 50) rankMsg = 'अभ्यास जारी रखें! नीचे दिए गए हल देखकर समझें। 💪';
      else if (percent < 80) rankMsg = 'अच्छा प्रयास! थोड़ी और मेहनत से आप 100% ला सकते हैं। 👍';

      const app = document.getElementById('app');
      app.innerHTML = `
        <section class="result-score-card">
          <p>📘 ${escapeHtml(chapterTitle)}</p>
          <h2>${rankMsg}</h2>
          <div class="result-metrics">
            <div class="res-metric">
              <strong>${correctCount} / ${total}</strong>
              <span>सही उत्तर</span>
            </div>
            <div class="res-metric">
              <strong>${percent}%</strong>
              <span>कुल स्कोर</span>
            </div>
            <div class="res-metric">
              <strong>${wrong}</strong>
              <span>गलत</span>
            </div>
            <div class="res-metric">
              <strong>${skipped}</strong>
              <span>छोड़े</span>
            </div>
            <div class="res-metric">
              <strong>${formatTime(state.elapsed)}</strong>
              <span>समय लिया</span>
            </div>
          </div>
        </section>

        <!-- ACTION BUTTONS -->
        <div class="result-actions">
          <button type="button" class="btn-primary" id="retakeBtn">🔄 पुनः अभ्यास करें</button>
          <button type="button" class="btn-secondary" id="homeBtn">⌂ अध्याय मेनू</button>
          <button type="button" class="btn-secondary" style="background:#25d366; color:white; border-color:#1da851;" id="shareResultBtn">
            📲 WhatsApp पर स्कोर शेयर करें
          </button>
        </div>

        <!-- DETAILED ANSWER REVIEW -->
        <h3 style="margin: 0 0 16px; font-size: 18px;">📝 उत्तर-पत्रिका व संपूर्ण हल</h3>
        <div class="review-list">
          ${state.questions.map((q, i) => {
            const userAns = state.answers[i];
            const isCorrect = userAns === q.answer;
            const isSkipped = userAns === null;
            const statusClass = isSkipped ? 'skipped' : (isCorrect ? 'correct' : 'incorrect');
            const statusText = isSkipped ? 'छोड़ा गया' : (isCorrect ? '✓ सही उत्तर' : '✗ गलत उत्तर');

            return `
              <article class="review-card ${statusClass}">
                <div class="review-top">
                  <span style="font-size:12px; font-weight:800; color:var(--indigo);">प्रश्न ${i + 1}</span>
                  <span class="review-badge ${statusClass}">${statusText}</span>
                </div>
                <h4 class="review-prompt">${escapeHtml(q.prompt)}</h4>
                <div class="review-options">
                  ${q.options.map(opt => {
                    const isOfficialAns = opt === q.answer;
                    const isUserChoice = opt === userAns;
                    let optCls = '';
                    if (isOfficialAns) optCls = 'is-ans';
                    else if (isUserChoice && !isCorrect) optCls = 'user-wrong';

                    return `
                      <div class="review-opt ${optCls}">
                        ${isOfficialAns ? '✓ ' : (isUserChoice && !isCorrect ? '✗ ' : '')}
                        ${escapeHtml(opt)}
                      </div>
                    `;
                  }).join('')}
                </div>
                <div class="review-solution">
                  <div><strong>सही उत्तर:</strong> ${escapeHtml(q.answer)}</div>
                  ${userAns && !isCorrect ? `<div style="margin-top:4px; color:var(--red);"><strong>आपका उत्तर:</strong> ${escapeHtml(userAns)}</div>` : ''}
                  <div style="margin-top:6px;"><strong>विस्तृत हल:</strong> ${escapeHtml(q.solution || q.explanation || 'उत्तर सीधे सूत्र व नियमानुसार है।')}</div>
                </div>
              </article>
            `;
          }).join('')}
        </div>
      `;

      document.getElementById('retakeBtn').addEventListener('click', () => {
        if (state.isMegaMock) startMegaMock();
        else startQuiz(state.chapterIndex);
      });

      document.getElementById('homeBtn').addEventListener('click', renderHome);

      document.getElementById('shareResultBtn').addEventListener('click', () => {
        const text = `मैंने राजस्थान शाला दर्पण कक्षा 10 गणित के ${chapterTitle} में ${total} में से ${correctCount} प्रश्न सही किए (${percent}%)! आप भी अभ्यास करें: ${window.location.href}`;
        const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`;
        window.open(waUrl, '_blank');
      });
    }

    // STUDY / SOLUTIONS VIEW
    function renderStudy(chapterIdx) {
      state.view = 'study';
      clearInterval(state.timer);
      const bank = getBank();
      const chapter = bank[chapterIdx];
      if (!chapter) return;

      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="view-card">
          <div class="view-top">
            <div class="breadcrumbs">
              <button type="button" id="studyBreadHome">⌂ मुख्य सूची</button>
              <span>›</span>
              <strong>${escapeHtml(chapter.chapterTitle)}</strong>
              <span>›</span>
              <span>हल व उत्तर-कुंजी</span>
            </div>
            <button type="button" class="btn-primary" id="studyStartQuiz">
              🎯 इस अध्याय की क्विज़ दें
            </button>
          </div>

          <div style="margin-bottom: 24px;">
            <h2 style="margin: 0 0 6px; font-size: 22px;">${escapeHtml(chapter.chapterTitle)}</h2>
            <p style="margin: 0; color: var(--muted); font-size: 13.5px;">शाला दर्पण प्रश्न-बैंक के सभी ${chapter.questions.length} वस्तुनिष्ठ प्रश्नों के प्रामाणिक उत्तर व विस्तृत चरणबद्ध हल।</p>
          </div>

          <div class="review-list">
            ${chapter.questions.map((q, i) => `
              <article class="study-card">
                <span class="study-qnum">प्रश्न संख्या ${i + 1}</span>
                <h3 class="review-prompt">${escapeHtml(q.prompt)}</h3>
                <div class="review-options">
                  ${q.options.map(opt => `
                    <div class="review-opt ${opt === q.answer ? 'is-ans' : ''}">
                      ${opt === q.answer ? '✓ ' : ''}${escapeHtml(opt)}
                    </div>
                  `).join('')}
                </div>
                <div class="review-solution">
                  <div><strong>सही उत्तर:</strong> ${escapeHtml(q.answer)}</div>
                  <div style="margin-top:6px;"><strong>हल:</strong> ${escapeHtml(q.solution || q.explanation || 'उत्तर सीधे सूत्र व नियमानुसार है।')}</div>
                  ${q.hint ? `<div style="margin-top:6px; color:#64748b;"><strong>संकेत:</strong> ${escapeHtml(q.hint)}</div>` : ''}
                </div>
              </article>
            `).join('')}
          </div>

          <div style="text-align:center; margin-top:26px;">
            <button type="button" class="btn-primary" id="studyStartQuizBottom">
              🎯 अब क्विज़ देकर अपनी तैयारी परखें
            </button>
          </div>
        </div>
      `;

      document.getElementById('studyBreadHome').addEventListener('click', renderHome);
      document.getElementById('studyStartQuiz').addEventListener('click', () => startQuiz(chapterIdx));
      document.getElementById('studyStartQuizBottom').addEventListener('click', () => startQuiz(chapterIdx));
    }

    // SHARE MODAL
    function openShareModal() {
      const modalContainer = document.getElementById('modalContainer');
      const currentUrl = window.location.href.split('#')[0];
      const shareText = `📚 राजस्थान स्कूल शिक्षा परिषद (शाला दर्पण) कक्षा 10 गणित प्रश्न-बैंक क्विज़! 14 अध्याय + 2 मॉडल पेपर्स के 162 प्रामाणिक प्रश्न और संपूर्ण हल ऑनलाइन उपलब्ध हैं: ${currentUrl}`;
      const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;

      modalContainer.innerHTML = `
        <div class="modal-overlay" id="modalBg">
          <div class="modal-content">
            <button type="button" class="modal-close" id="modalCloseBtn">✕</button>
            <h3 style="margin:0 0 8px; font-size:18px;">📲 मित्रों के साथ साझा करें</h3>
            <p style="margin:0 0 16px; font-size:13px; color:var(--muted);">
              व्हाट्सएप पर लिंक भेजकर अपने सहपाठियों को भी कक्षा 10 गणित शाला दर्पण प्रश्न-बैंक से अभ्यास कराएं।
            </p>
            <div class="share-url-box">
              <input type="text" class="share-url-input" id="shareUrlInput" value="${escapeHtml(currentUrl)}" readonly>
              <button type="button" class="btn-copy" id="copyUrlBtn">कॉपी करें</button>
            </div>
            <div style="display:flex; gap:10px; flex-direction:column;">
              <a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="btn-hero btn-hero-primary" style="background:#25d366; color:white; text-decoration:none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.771-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86.173.086.275.071.376-.044.101-.116.433-.506.549-.68.116-.173.231-.145.39-.086s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.099.824zm-3.423-14.416c-6.627 0-12 5.373-12 12 0 2.158.572 4.184 1.572 5.939l-1.572 5.889 6.068-1.591c1.705.934 3.659 1.47 5.741 1.47 6.627 0 12-5.373 12-12 0-6.627-5.373-12-12-12z"/></svg>
                <span>व्हाट्सएप पर शेयर करें</span>
              </a>
            </div>
          </div>
        </div>
      `;

      document.getElementById('modalCloseBtn').addEventListener('click', () => {
        modalContainer.innerHTML = '';
      });
      document.getElementById('modalBg').addEventListener('click', (e) => {
        if (e.target.id === 'modalBg') modalContainer.innerHTML = '';
      });
      document.getElementById('copyUrlBtn').addEventListener('click', () => {
        const inp = document.getElementById('shareUrlInput');
        inp.select();
        navigator.clipboard.writeText(inp.value).then(() => {
          showToast('लिंक कॉपी हो गया!');
        }).catch(() => {
          document.execCommand('copy');
          showToast('लिंक कॉपी हो गया!');
        });
      });
    }

    document.getElementById('topbarShareBtn').addEventListener('click', openShareModal);

    // Initial render
    renderHome();
  </script>
  <script src="exam-suite.js?v=2.5"></script>
  <script>document.addEventListener("DOMContentLoaded", () => { if (window.ExamSuite) ExamSuite.renderNavbar("shala-darpan"); });</script>
</body>
</html>

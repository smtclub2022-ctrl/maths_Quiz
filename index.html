<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 10 Board Maths Quiz</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #3498db; --success: #27ae60; --error: #e74c3c; }
        body { background: #f0f3f5; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .quiz-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 95%; max-width: 500px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .timer { font-weight: bold; color: var(--error); font-size: 1.2rem; }
        .question { font-size: 1.2rem; font-weight: 600; color: var(--primary); margin-bottom: 20px; }
        .options-grid { display: grid; gap: 12px; }
        .btn { background: #fff; border: 2px solid #ddd; padding: 14px; border-radius: 8px; cursor: pointer; font-size: 1rem; text-align: left; transition: 0.2s; }
        .btn:hover { border-color: var(--secondary); background: #f7faff; }
        .btn.correct { background: var(--success); color: white; border-color: var(--success); }
        .btn.wrong { background: var(--error); color: white; border-color: var(--error); }
        .progress-container { width: 100%; height: 8px; background: #eee; border-radius: 4px; margin-top: 20px; overflow: hidden; }
        #progress-bar { width: 0%; height: 100%; background: var(--secondary); transition: 0.3s; }
        .hidden { display: none; }
        .result-screen { text-align: center; }
        .score-big { font-size: 3rem; color: var(--success); margin: 10px 0; }
        .restart-btn { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 1rem; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="quiz-card" id="quiz-box">
        <div class="header">
            <span id="q-count">Question 1/12</span>
            <div class="timer">Time: <span id="timer-sec">20</span>s</div>
        </div>
        
        <div class="question" id="question-text">Loading...</div>
        
        <div class="options-grid" id="options-container"></div>
        
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
    </div>

    <div class="quiz-card hidden" id="result-box">
        <div class="result-screen">
            <h2>Quiz Completed!</h2>
            <div class="score-big" id="final-score">0</div>
            <p id="feedback-text"></p>
            <button class="restart-btn" onclick="location.reload()">Try Again</button>
        </div>
    </div>

    <script>
        const quizData = [
            { q: "The sum of the powers of the prime factors of 196 is:", options: ["1", "2", "4", "6"], correct: 2 },
            { q: "If roots of x² – kx + 4 = 0 are equal, the value of k is:", options: ["±1", "±2", "±3", "±4"], correct: 3 },
            { q: "The distance of point (3, 4) from the y-axis is:", options: ["1", "2", "3", "4"], correct: 2 },
            { q: "The discriminant of 3√3x² + 10x + √3 = 0 is:", options: ["8", "30", "46", "64"], correct: 3 },
            { q: "If 18, a, b, -3 are in A.P., the value of (a + b) is:", options: ["7", "11", "15", "19"], correct: 2 },
            { q: "Value of: 3 sec 45° cos 45°", options: ["0", "1", "2", "3"], correct: 3 },
            { q: "HCF of numbers 54 and 336 is:", options: ["2", "3", "6", "9"], correct: 2 },
            { q: "The degree of polynomial P(x) = (3 - x)(x - 4) is:", options: ["2", "4", "0", "3"], correct: 0 },
            { q: "A die is thrown once. Probability of getting number > 4 is:", options: ["1/2", "1/3", "3/4", "1"], correct: 1 },
            { q: "HCF of 95 and 152 is:", options: ["1", "19", "57", "38"], correct: 1 },
            { q: "The coordinates of the origin are:", options: ["(1,1)", "(0,0)", "(0,1)", "(1,0)"], correct: 1 },
            { q: "The value of (sin² 60° + cos² 60°) is:", options: ["0", "1", "2", "1/2"], correct: 1 }
        ];

        let currentQ = 0;
        let score = 0;
        let timeLeft = 20;
        let timer;

        function startTimer() {
            timeLeft = 20;
            document.getElementById('timer-sec').innerText = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-sec').innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(timer);
                    handleAnswer(-1); // Auto-skip if time runs out
                }
            }, 1000);
        }

        function loadQuestion() {
            clearInterval(timer);
            const data = quizData[currentQ];
            document.getElementById('question-text').innerText = data.q;
            document.getElementById('q-count').innerText = `Question ${currentQ + 1}/${quizData.length}`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            
            data.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(i);
                container.appendChild(btn);
            });

            document.getElementById('progress-bar').style.width = `${((currentQ) / quizData.length) * 100}%`;
            startTimer();
        }

        function handleAnswer(selectedIndex) {
            clearInterval(timer);
            const correctIndex = quizData[currentQ].correct;
            const buttons = document.querySelectorAll('.btn');

            if(selectedIndex === correctIndex) {
                score++;
                if(selectedIndex !== -1) buttons[selectedIndex].classList.add('correct');
            } else {
                if(selectedIndex !== -1) buttons[selectedIndex].classList.add('wrong');
                buttons[correctIndex].classList.add('correct');
            }

            // Disable all buttons after clicking
            buttons.forEach(b => b.disabled = true);

            setTimeout(() => {
                currentQ++;
                if(currentQ < quizData.length) {
                    loadQuestion();
                } else {
                    showResults();
                }
            }, 1500);
        }

        function showResults() {
            document.getElementById('quiz-box').classList.add('hidden');
            document.getElementById('result-box').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score}/${quizData.length}`;
            
            let feedback = "";
            if(score === quizData.length) feedback = "Excellent! You are a Math Genius! 🏆";
            else if(score > quizData.length/2) feedback = "Good Job! Keep practicing. 👍";
            else feedback = "Keep studying! You can do better. 📚";
            
            document.getElementById('feedback-text').innerText = feedback;
        }

        loadQuestion();
    </script>
</body>
</html>

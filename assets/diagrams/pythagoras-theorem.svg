<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="hypGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="sideAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sideBGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
  </defs>
  <rect width="600" height="420" rx="16" fill="#0f172a"/>

  <!-- Title -->
  <text x="300" y="38" fill="#f8fafc" font-size="17" font-weight="bold" text-anchor="middle">पाइथागोरस प्रमेय (Pythagoras Theorem)</text>
  <text x="300" y="60" fill="#94a3b8" font-size="13" text-anchor="middle">समकोण त्रिभुज में: कर्ण² = लम्ब² + आधार²</text>

  <!-- Right Triangle: Vertices A(200, 130), B(200, 310), C(440, 310) -->
  <polygon points="200,130 200,310 440,310" fill="rgba(99, 102, 241, 0.15)" stroke="#818cf8" stroke-width="3"/>

  <!-- Right angle box at B(200, 310) -->
  <polyline points="200,285 225,285 225,310" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="212" cy="298" r="2.5" fill="#f59e0b"/>

  <!-- Side labels -->
  <!-- Perpendicular a -->
  <text x="145" y="225" fill="#60a5fa" font-size="14" font-weight="bold">लम्ब (a)</text>
  <text x="145" y="245" fill="#93c5fd" font-size="12">Side a = 3</text>

  <!-- Base b -->
  <text x="305" y="340" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">आधार (b)</text>
  <text x="305" y="360" fill="#86efac" font-size="12" text-anchor="middle">Side b = 4</text>

  <!-- Hypotenuse c -->
  <text x="340" y="200" fill="#f472b6" font-size="15" font-weight="bold">कर्ण (c)</text>
  <text x="340" y="222" fill="#fbcfe8" font-size="12">Hypotenuse c = 5</text>

  <!-- Vertices tags -->
  <circle cx="200" cy="130" r="5" fill="#38bdf8"/>
  <text x="190" y="120" fill="#e2e8f0" font-size="14" font-weight="bold">A</text>
  <circle cx="200" cy="310" r="5" fill="#f59e0b"/>
  <text x="185" y="330" fill="#e2e8f0" font-size="14" font-weight="bold">B (90°)</text>
  <circle cx="440" cy="310" r="5" fill="#10b981"/>
  <text x="450" y="325" fill="#e2e8f0" font-size="14" font-weight="bold">C</text>

  <!-- Formula Box -->
  <rect x="360" y="90" width="200" height="85" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="375" y="118" fill="#fb7185" font-size="16" font-weight="bold">c² = a² + b²</text>
  <text x="375" y="142" fill="#e2e8f0" font-size="13">5² = 3² + 4²</text>
  <text x="375" y="162" fill="#34d399" font-size="13" font-weight="bold">25 = 9 + 16 (सत्य)</text>
</svg>
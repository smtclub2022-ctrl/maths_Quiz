<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <defs>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="540" height="320" rx="16" fill="var(--paper, #ffffff)" stroke="var(--line, #e2e8f0)" stroke-width="1.5" filter="url(#shadow4)"/>
  
  <!-- Title Badge -->
  <rect x="24" y="16" width="260" height="26" rx="6" fill="#fef3c7"/>
  <text x="34" y="33" font-family="'DM Sans', 'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="700" fill="#b45309">
    🔺 आधारभूत आनुपातिकता प्रमेय (थैल्स प्रमेय)
  </text>

  <!-- Triangle ABC -->
  <!-- A: (190, 60), B: (80, 260), C: (300, 260) -->
  <polygon points="190,60 80,260 300,260" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Parallel Line DE || BC at y = 160 -->
  <!-- D on AB: at y=160 -> x = 135 -->
  <!-- E on AC: at y=160 -> x = 245 -->
  <line x1="135" y1="160" x2="245" y2="160" stroke="#dc2626" stroke-width="2.5"/>

  <!-- Arrows on DE and BC to denote parallel -->
  <path d="M 185,156 L 195,160 L 185,164" fill="none" stroke="#dc2626" stroke-width="2"/>
  <path d="M 185,256 L 195,260 L 185,264" fill="none" stroke="#d97706" stroke-width="2"/>

  <!-- Vertices -->
  <circle cx="190" cy="60" r="4" fill="#0f172a"/>
  <text x="186" y="50" font-family="sans-serif" font-size="14" font-weight="800" fill="#0f172a">A</text>

  <circle cx="80" cy="260" r="4" fill="#0f172a"/>
  <text x="64" y="275" font-family="sans-serif" font-size="14" font-weight="800" fill="#0f172a">B</text>

  <circle cx="300" cy="260" r="4" fill="#0f172a"/>
  <text x="306" y="275" font-family="sans-serif" font-size="14" font-weight="800" fill="#0f172a">C</text>

  <circle cx="135" cy="160" r="4" fill="#dc2626"/>
  <text x="116" y="160" font-family="sans-serif" font-size="14" font-weight="800" fill="#dc2626">D</text>

  <circle cx="245" cy="160" r="4" fill="#dc2626"/>
  <text x="252" y="160" font-family="sans-serif" font-size="14" font-weight="800" fill="#dc2626">E</text>

  <!-- Segment annotations -->
  <text x="135" y="110" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">AD</text>
  <text x="88" y="215" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">DB</text>
  <text x="228" y="110" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">AE</text>
  <text x="280" y="215" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">EC</text>

  <!-- Formulas Container Box -->
  <rect x="360" y="50" width="165" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="374" y="76" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="800" fill="#0f172a">थैल्स प्रमेय नियम</text>

  <g font-family="'DM Sans', 'Noto Sans Devanagari', sans-serif" font-size="11" font-weight="600" fill="#334155">
    <text x="374" y="104" fill="#d97706" font-weight="800">यदि DE || BC हो, तो:</text>
    
    <text x="374" y="132" font-size="13" font-weight="800" fill="#dc2626">AD / DB = AE / EC</text>
    
    <text x="374" y="166" fill="#6558df" font-weight="800">अन्य अनुपात:</text>
    <text x="374" y="186">AD / AB = AE / AC</text>
    <text x="374" y="206">DB / AB = EC / AC</text>
    
    <text x="374" y="238" fill="#059669" font-weight="800">समरूप त्रिभुज:</text>
    <text x="374" y="258">ΔADE ~ ΔABC</text>
    <text x="374" y="278">DE / BC = AD / AB</text>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="540" height="320" rx="16" fill="var(--paper, #ffffff)" stroke="var(--line, #e2e8f0)" stroke-width="1.5" filter="url(#shadow3)"/>
  
  <!-- Title Badge -->
  <rect x="24" y="16" width="240" height="26" rx="6" fill="#fef2f2"/>
  <text x="34" y="33" font-family="'DM Sans', 'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="700" fill="#dc2626">
    ⭕ वृत्त की स्पर्श रेखाएँ (Circle Tangent Theorems)
  </text>

  <!-- Circle at O(160, 170), r = 75 -->
  <circle cx="160" cy="170" r="75" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="160" cy="170" r="4" fill="#0f172a"/>
  <text x="146" y="166" font-family="sans-serif" font-size="14" font-weight="800" fill="#0f172a">O</text>

  <!-- External Point P(340, 170) -->
  <circle cx="340" cy="170" r="5" fill="#6558df"/>
  <text x="352" y="174" font-family="sans-serif" font-size="15" font-weight="800" fill="#6558df">P (बाह्य बिंदु)</text>

  <!-- Tangent points A(200, 105), B(200, 235) -->
  <!-- Line OA -->
  <line x1="160" y1="170" x2="200" y2="105" stroke="#059669" stroke-width="2"/>
  <text x="160" y="130" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669">r</text>

  <!-- Line OB -->
  <line x1="160" y1="170" x2="200" y2="235" stroke="#059669" stroke-width="2"/>
  <text x="160" y="220" font-family="sans-serif" font-size="11" font-weight="700" fill="#059669">r</text>

  <!-- Line OP -->
  <line x1="160" y1="170" x2="340" y2="170" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Tangent PA -->
  <line x1="340" y1="170" x2="200" y2="105" stroke="#6558df" stroke-width="2.5"/>
  <circle cx="200" cy="105" r="4" fill="#0f172a"/>
  <text x="195" y="94" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a">A</text>

  <!-- Tangent PB -->
  <line x1="340" y1="170" x2="200" y2="235" stroke="#6558df" stroke-width="2.5"/>
  <circle cx="200" cy="235" r="4" fill="#0f172a"/>
  <text x="195" y="255" font-family="sans-serif" font-size="13" font-weight="800" fill="#0f172a">B</text>

  <!-- Right Angle Markers at A and B -->
  <path d="M 190,120 L 205,128 L 214,114" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <path d="M 190,220 L 205,212 L 214,226" fill="none" stroke="#dc2626" stroke-width="1.8"/>

  <!-- Formulas Container Box -->
  <rect x="375" y="50" width="150" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="388" y="76" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="800" fill="#0f172a">प्रमुख प्रमेय</text>

  <g font-family="'DM Sans', 'Noto Sans Devanagari', sans-serif" font-size="11" font-weight="600" fill="#334155">
    <text x="388" y="104" fill="#dc2626" font-weight="800">प्रमेय 10.1:</text>
    <text x="388" y="122">त्रिज्या ⊥ स्पर्श रेखा</text>
    <text x="388" y="138">OA ⊥ PA (90°)</text>

    <text x="388" y="172" fill="#6558df" font-weight="800">प्रमेय 10.2:</text>
    <text x="388" y="190">बाह्य बिंदु से स्पर्श</text>
    <text x="388" y="206">रेखाएँ समान होती हैं:</text>
    <text x="388" y="226" font-weight="800" fill="#059669" font-size="13">PA = PB</text>

    <text x="388" y="258" fill="#d97706" font-weight="800">संपूरक कोण:</text>
    <text x="388" y="278">∠APB + ∠AOB = 180°</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRoadmap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="380" rx="16" fill="url(#bgRoadmap)" stroke="#334155" stroke-width="2"/>
  
  <text x="400" y="42" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle" font-family="system-ui, sans-serif">KakshaGyan 4-चरण सफलता रोडमैप (Learning Roadmap)</text>
  <text x="400" y="68" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif">कक्षा 9 और 10 के विद्यार्थियों के लिए उत्कृष्ट तैयारी की वैज्ञानिक विधि</text>

  <!-- Connecting Path Flow -->
  <path d="M 120 180 L 290 180 L 480 180 L 670 180" fill="none" stroke="url(#arrowGrad)" stroke-width="4" stroke-dasharray="6,4"/>

  <!-- Step 1 -->
  <g transform="translate(60, 110)">
    <circle cx="60" cy="70" r="42" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
    <text x="60" y="65" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">1</text>
    <text x="60" y="82" fill="#e0f2fe" font-size="10" font-weight="bold" text-anchor="middle">STEP</text>
    <text x="60" y="135" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">संकल्पना सिद्धि</text>
    <text x="60" y="155" fill="#94a3b8" font-size="11" text-anchor="middle">Concept Notes &amp; Video</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(245, 110)">
    <circle cx="60" cy="70" r="42" fill="#4f46e5" stroke="#818cf8" stroke-width="3"/>
    <text x="60" y="65" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">2</text>
    <text x="60" y="82" fill="#e0e7ff" font-size="10" font-weight="bold" text-anchor="middle">STEP</text>
    <text x="60" y="135" fill="#818cf8" font-size="14" font-weight="bold" text-anchor="middle">अध्यायवार अभ्यास</text>
    <text x="60" y="155" fill="#94a3b8" font-size="11" text-anchor="middle">NCERT / RBSE Solutions</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(430, 110)">
    <circle cx="60" cy="70" r="42" fill="#059669" stroke="#34d399" stroke-width="3"/>
    <text x="60" y="65" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">3</text>
    <text x="60" y="82" fill="#d1fae5" font-size="10" font-weight="bold" text-anchor="middle">STEP</text>
    <text x="60" y="135" fill="#34d399" font-size="14" font-weight="bold" text-anchor="middle">क्विज़ एवं विश्लेषण</text>
    <text x="60" y="155" fill="#94a3b8" font-size="11" text-anchor="middle">Instant Test &amp; Analytics</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(615, 110)">
    <circle cx="60" cy="70" r="42" fill="#db2777" stroke="#f472b6" stroke-width="3"/>
    <text x="60" y="65" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">4</text>
    <text x="60" y="82" fill="#fce7f3" font-size="10" font-weight="bold" text-anchor="middle">STEP</text>
    <text x="60" y="135" fill="#f472b6" font-size="14" font-weight="bold" text-anchor="middle">100% बोर्ड सफलता</text>
    <text x="60" y="155" fill="#94a3b8" font-size="11" text-anchor="middle">Board Ready Mastery</text>
  </g>

  <!-- Bottom Tip Banner -->
  <g transform="translate(60, 310)">
    <rect width="680" height="45" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="340" y="28" fill="#facc15" font-size="13" font-weight="bold" text-anchor="middle">💡 प्रतिदिन 45 मिनट अभ्यास = बोर्ड परीक्षा में 95%+ अंक सुनिश्चित!</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="parabolaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="#0f172a"/>
  
  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4,4" opacity="0.6">
    <line x1="60" y1="80" x2="540" y2="80"/>
    <line x1="60" y1="140" x2="540" y2="140"/>
    <line x1="60" y1="200" x2="540" y2="200"/>
    <line x1="60" y1="260" x2="540" y2="260"/>
    <line x1="60" y1="320" x2="540" y2="320"/>
    
    <line x1="120" y1="40" x2="120" y2="360"/>
    <line x1="180" y1="40" x2="180" y2="360"/>
    <line x1="240" y1="40" x2="240" y2="360"/>
    <line x1="300" y1="40" x2="300" y2="360"/>
    <line x1="360" y1="40" x2="360" y2="360"/>
    <line x1="420" y1="40" x2="420" y2="360"/>
    <line x1="480" y1="40" x2="480" y2="360"/>
  </g>

  <!-- Axes -->
  <line x1="60" y1="260" x2="540" y2="260" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="300" y1="360" x2="300" y2="40" stroke="#94a3b8" stroke-width="2.5"/>
  <polygon points="545,260 535,255 535,265" fill="#94a3b8"/>
  <polygon points="300,35 295,45 305,45" fill="#94a3b8"/>

  <text x="548" y="275" fill="#e2e8f0" font-size="14" font-weight="bold">X</text>
  <text x="312" y="48" fill="#e2e8f0" font-size="14" font-weight="bold">Y</text>
  <text x="286" y="276" fill="#94a3b8" font-size="13">O</text>

  <!-- Axis of Symmetry -->
  <line x1="300" y1="50" x2="300" y2="350" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="306" y="90" fill="#f59e0b" font-size="12" font-weight="600">सममिति अक्ष: x = -b/2a</text>

  <!-- Parabola Curve y = a(x-h)^2 + k -->
  <path d="M 140,80 Q 300,430 460,80" fill="none" stroke="url(#parabolaGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Roots Points -->
  <circle cx="180" cy="260" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <circle cx="420" cy="260" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
  <text x="155" y="290" fill="#f87171" font-size="13" font-weight="bold">मूल α (x₁)</text>
  <text x="405" y="290" fill="#f87171" font-size="13" font-weight="bold">मूल β (x₂)</text>

  <!-- Vertex -->
  <circle cx="300" cy="300" r="6" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
  <text x="312" y="325" fill="#34d399" font-size="13" font-weight="bold">शीर्ष V(-b/2a, -D/4a)</text>

  <!-- Formula Badge -->
  <rect x="70" y="45" width="200" height="36" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="80" y="68" fill="#38bdf8" font-size="13" font-weight="bold">y = ax² + bx + c (a &gt; 0)</text>

  <rect x="360" y="45" width="170" height="36" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="370" y="68" fill="#a78bfa" font-size="13" font-weight="bold">D = b² - 4ac &gt; 0</text>
</svg>
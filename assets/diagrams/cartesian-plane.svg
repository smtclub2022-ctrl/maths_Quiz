<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="100%" height="100%">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="540" height="340" rx="16" fill="var(--paper, #ffffff)" stroke="var(--line, #e2e8f0)" stroke-width="1.5" filter="url(#shadow2)"/>
  
  <!-- Title Badge -->
  <rect x="24" y="16" width="220" height="26" rx="6" fill="#e0f2fe"/>
  <text x="34" y="33" font-family="'DM Sans', 'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="700" fill="#0284c7">
    📍 कार्तीय तल (Cartesian Coordinate Plane)
  </text>

  <!-- Grid lines -->
  <g stroke="#f1f5f9" stroke-width="1.2">
    <line x1="40" y1="80" x2="340" y2="80"/>
    <line x1="40" y1="120" x2="340" y2="120"/>
    <line x1="40" y1="160" x2="340" y2="160"/>
    <line x1="40" y1="200" x2="340" y2="200"/>
    <line x1="40" y1="240" x2="340" y2="240"/>
    <line x1="40" y1="280" x2="340" y2="280"/>

    <line x1="70" y1="50" x2="70" y2="310"/>
    <line x1="110" y1="50" x2="110" y2="310"/>
    <line x1="150" y1="50" x2="150" y2="310"/>
    <line x1="190" y1="50" x2="190" y2="310"/>
    <line x1="230" y1="50" x2="230" y2="310"/>
    <line x1="270" y1="50" x2="270" y2="310"/>
    <line x1="310" y1="50" x2="310" y2="310"/>
  </g>

  <!-- Axes -->
  <!-- X-Axis (y = 180) -->
  <line x1="30" y1="180" x2="350" y2="180" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="355" y="184" font-family="sans-serif" font-size="14" font-weight="800" fill="#0f172a">X</text>
  <text x="18" y="184" font-family="sans-serif" font-size="14" font-weight="800" fill="#0f172a">X'</text>

  <!-- Y-Axis (x = 190) -->
  <line x1="190" y1="320" x2="190" y2="45" stroke="#0f172a" stroke-width="2.5"/>
  <text x="186" y="38" font-family="sans-serif" font-size="14" font-weight="800" fill="#0f172a">Y</text>
  <text x="186" y="335" font-family="sans-serif" font-size="14" font-weight="800" fill="#0f172a">Y'</text>

  <!-- Origin -->
  <circle cx="190" cy="180" r="4" fill="#0f172a"/>
  <text x="195" y="196" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">O (0,0)</text>

  <!-- Quadrants Labels -->
  <text x="250" y="100" font-family="'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="800" fill="#0284c7">प्रथम चतुर्थांश (+, +)</text>
  <text x="50" y="100" font-family="'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="800" fill="#d97706">द्वितीय चतुर्थांश (-, +)</text>
  <text x="50" y="270" font-family="'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="800" fill="#64748b">तृतीय चतुर्थांश (-, -)</text>
  <text x="250" y="270" font-family="'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="800" fill="#7c3aed">चतुर्थ चतुर्थांश (+, -)</text>

  <!-- Plotted Point A(3, 2) -> (190 + 3*25 = 265, 180 - 2*25 = 130) -->
  <circle cx="265" cy="130" r="5" fill="#e11d48"/>
  <line x1="190" y1="130" x2="265" y2="130" stroke="#e11d48" stroke-dasharray="3,3"/>
  <line x1="265" y1="180" x2="265" y2="130" stroke="#e11d48" stroke-dasharray="3,3"/>
  <text x="272" y="126" font-family="'DM Sans', sans-serif" font-size="12" font-weight="800" fill="#e11d48">P (3, 2)</text>

  <!-- Plotted Point B(-2, -2) -->
  <circle cx="140" cy="230" r="5" fill="#0d9488"/>
  <line x1="190" y1="230" x2="140" y2="230" stroke="#0d9488" stroke-dasharray="3,3"/>
  <line x1="140" y1="180" x2="140" y2="230" stroke="#0d9488" stroke-dasharray="3,3"/>
  <text x="96" y="244" font-family="'DM Sans', sans-serif" font-size="12" font-weight="800" fill="#0d9488">Q (-2, -2)</text>

  <!-- Formulas Container Box -->
  <rect x="375" y="45" width="150" height="275" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="388" y="72" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="800" fill="#0f172a">निर्देशांक सूत्र</text>

  <g font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#334155">
    <text x="388" y="98" fill="#0284c7" font-weight="800">1. दूरी सूत्र (Distance):</text>
    <text x="388" y="118">d = √[(x₂-x₁)² + (y₂-y₁)²]</text>
    
    <text x="388" y="150" fill="#0284c7" font-weight="800">2. विभाजन सूत्र (Section):</text>
    <text x="388" y="170">x = (m₁x₂ + m₂x₁)/(m₁+m₂)</text>
    <text x="388" y="188">y = (m₁y₂ + m₂y₁)/(m₁+m₂)</text>

    <text x="388" y="220" fill="#0284c7" font-weight="800">3. मध्य बिंदु (Midpoint):</text>
    <text x="388" y="240">M = [(x₁+x₂)/2, (y₁+y₂)/2]</text>

    <text x="388" y="270" fill="#0284c7" font-weight="800">4. केंद्रक (Centroid):</text>
    <text x="388" y="290">G = (Σx/3, Σy/3)</text>
  </g>
</svg>


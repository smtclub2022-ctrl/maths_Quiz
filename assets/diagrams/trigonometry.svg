<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%">
  <defs>
    <linearGradient id="triGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6558df" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="540" height="320" rx="16" fill="var(--paper, #ffffff)" stroke="var(--line, #e2e8f0)" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Title Badge -->
  <rect x="24" y="18" width="220" height="26" rx="6" fill="#ede9fe"/>
  <text x="34" y="35" font-family="'DM Sans', 'Noto Sans Devanagari', sans-serif" font-size="12" font-weight="700" fill="#6558df">
    📐 समकोण त्रिभुज एवं त्रिकोणमितीय अनुपात
  </text>

  <!-- Triangle Polygon -->
  <!-- A: (100, 70), B: (100, 240), C: (320, 240) -->
  <polygon points="100,70 100,240 320,240" fill="url(#triGrad)" stroke="#6558df" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Right Angle Marker at B -->
  <rect x="100" y="216" width="24" height="24" fill="none" stroke="#6558df" stroke-width="2"/>
  
  <!-- Angle Theta Arc at C -->
  <path d="M 280,240 A 40,40 0 0,0 292,212" fill="none" stroke="#e11d48" stroke-width="2.5"/>
  <text x="268" y="228" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#e11d48">θ</text>

  <!-- Vertices Labels -->
  <circle cx="100" cy="70" r="4" fill="#6558df"/>
  <text x="82" y="66" font-family="sans-serif" font-size="15" font-weight="800" fill="#1e293b">A</text>

  <circle cx="100" cy="240" r="4" fill="#6558df"/>
  <text x="82" y="258" font-family="sans-serif" font-size="15" font-weight="800" fill="#1e293b">B (90°)</text>

  <circle cx="320" cy="240" r="4" fill="#6558df"/>
  <text x="330" y="254" font-family="sans-serif" font-size="15" font-weight="800" fill="#1e293b">C</text>

  <!-- Side Labels -->
  <!-- Perpendicular AB -->
  <text x="30" y="160" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="700" fill="#475569">लंब (P)</text>
  <text x="30" y="176" font-family="'DM Sans', sans-serif" font-size="11" fill="#64748b">Perpendicular</text>

  <!-- Base BC -->
  <text x="180" y="266" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="700" fill="#475569">आधार (Base - B)</text>

  <!-- Hypotenuse AC -->
  <text x="215" y="140" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="700" fill="#475569" transform="rotate(-38 215 140)">कर्ण (Hypotenuse - H)</text>

  <!-- Formulas Container Box -->
  <rect x="350" y="60" width="170" height="230" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="365" y="86" font-family="'Noto Sans Devanagari', sans-serif" font-size="13" font-weight="800" fill="#0f172a">त्रिकोणमितीय सूत्र</text>

  <g font-family="'DM Sans', sans-serif" font-size="12" font-weight="600" fill="#334155">
    <text x="365" y="116">sin θ = लंब / कर्ण (P/H)</text>
    <text x="365" y="142">cos θ = आधार / कर्ण (B/H)</text>
    <text x="365" y="168">tan θ = लंब / आधार (P/B)</text>
    <line x1="365" y1="180" x2="505" y2="180" stroke="#cbd5e1" stroke-width="1"/>
    <text x="365" y="202" fill="#6558df">cot θ = 1 / tan θ</text>
    <text x="365" y="226" fill="#6558df">sec θ = 1 / cos θ</text>
    <text x="365" y="250" fill="#6558df">cosec θ = 1 / sin θ</text>
    <text x="365" y="276" font-weight="800" fill="#059669">H² = B² + P²</text>
  </g>
</svg>

